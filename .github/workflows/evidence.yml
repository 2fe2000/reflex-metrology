name: Verify REFLEX evidence
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-replay-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install portable verification dependencies
        run: python -m pip install numpy==2.4.6 pandas
      - name: Verify causal inference and reference replays
        run: python -m unittest -v test_runtime test_delay_model test_device_surrogate
      - name: Verify result arithmetic and content hashes
        run: python verify_evidence.py
      - name: Record server-side build identity
        run: |
          python -c 'import os,json,datetime; print(json.dumps({"utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"]}))' > ci_identity.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-evidence-${{ github.sha }}
          path: |
            ci_identity.json
            submission_manifest.json
            provenance/build_record.json
            results/customer/summary.json
            results/inverse/summary.json
          retention-days: 90
